- slug: driving-instructor
  family: transport_logistics
  title: {en: Driving instructor, ta: ஓட்டுநர் பயிற்றுநர்}
  description:
    en: Teaches people how to drive safely and follow traffic rules, usually at a driving school. Helps learners build confidence and get ready for the driving test.
    ta: பொதுவாக ஓட்டுநர் பள்ளியில் மக்களுக்குப் பாதுகாப்பாக வாகனம் ஓட்டவும் போக்குவரத்து விதிகளைப் பின்பற்றவும் கற்றுக்கொடுக்கிறார். கற்பவர்களுக்குத் தன்னம்பிக்கை வளர்த்து ஓட்டுநர் தேர்வுக்குத் தயார்படுத்த உதவுகிறார்.
  activities:
    en: [Teach vehicle controls and road rules, Guide learners during practice drives, Explain safe driving habits, Prepare learners for the driving test]
    ta: [வாகனக் கட்டுப்பாடுகளையும் சாலை விதிகளையும் கற்றுக்கொடுப்பது, பயிற்சி ஓட்டத்தில் கற்பவர்களுக்கு வழிகாட்டுவது, பாதுகாப்பான ஓட்டும் பழக்கங்களை விளக்குவது, கற்பவர்களை ஓட்டுநர் தேர்வுக்குத் தயார்படுத்துவது]
  skills:
    en: [Very safe and experienced driving, Patience with new learners, Clear explaining, Calm in tense moments]
    ta: [மிகவும் பாதுகாப்பான அனுபவமுள்ள ஓட்டுதல், புதிதாகக் கற்பவர்களிடம் பொறுமை, தெளிவாக விளக்கும் திறன், பதற்றமான நேரத்தில் அமைதி]
  entry:
    typical_min_stage: null
    notes:
      en: Typically instructors first gain driving experience and a licence, and then may need extra approval or training, which varies by place. This is a typical route, not an official requirement, so check the current transport rules.
      ta: பொதுவாக பயிற்றுநர்கள் முதலில் ஓட்டும் அனுபவமும் உரிமமும் பெறுகிறார்கள்; பிறகு கூடுதல் அனுமதி அல்லது பயிற்சி தேவைப்படலாம், இது இடத்துக்கு இடம் மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய போக்குவரத்து விதிகளைப் பாருங்கள்.
  routes:
