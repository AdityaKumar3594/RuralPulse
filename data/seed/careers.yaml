- slug: hotel-restaurant-staff
  family: hospitality
  title: {en: Hotel or restaurant staff, ta: ஹோட்டல் அல்லது உணவகப் பணியாளர்}
  description:
    en: Welcomes and serves guests in hotels, lodges and restaurants. Works at the front desk, serves food, or keeps rooms and dining areas clean and ready.
    ta: ஹோட்டல், லாட்ஜ், உணவகங்களில் விருந்தினர்களை வரவேற்றுச் சேவை செய்கிறார். வரவேற்பு மேசையில் வேலை செய்வது, உணவு பரிமாறுவது, அறைகளையும் உணவருந்தும் இடத்தையும் சுத்தமாகத் தயாராக வைப்பது போன்றவற்றைச் செய்கிறார்.
  activities:
    en: [Welcome guests and take their orders, Serve food and drinks, Keep rooms and tables clean and ready, Handle bills and answer guest questions]
    ta: [விருந்தினர்களை வரவேற்று ஆர்டர் எடுப்பது, உணவும் பானமும் பரிமாறுவது, அறைகளையும் மேசைகளையும் சுத்தமாகத் தயாராக வைப்பது, பில் போடுவது மற்றும் விருந்தினர் கேள்விகளுக்குப் பதில் சொல்வது]
  skills:
    en: [Polite and friendly manners, Good communication, Neatness and cleanliness, Staying calm with many guests]
    ta: [மரியாதையும் நட்புடனும் பழகுவது, நன்றாகப் பேசும் திறன், நேர்த்தியும் தூய்மையும், பல விருந்தினர்கள் இருக்கும்போதும் அமைதியாக இருப்பது]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically people start in a junior role and learn on the job, and hotel management courses also exist. The education needed varies by employer. This is a typical route, not an official requirement.
      ta: பொதுவாக ஆரம்பநிலைப் பணியில் சேர்ந்து வேலை செய்தபடியே கற்கிறார்கள்; ஹோட்டல் மேலாண்மைப் படிப்புகளும் உள்ளன. தேவையான படிப்பு நிறுவனத்தைப் பொறுத்து மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
