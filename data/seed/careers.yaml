- slug: tailor-fashion-designer
  family: creative_crafts
  title: {en: Tailor or fashion designer, ta: தையல்காரர் அல்லது ஆடை வடிவமைப்பாளர்}
  description:
    en: Cuts and stitches clothes for customers, and may design new styles. Many work from their own shop or home, and some work in garment units.
    ta: வாடிக்கையாளர்களுக்குத் துணியை வெட்டித் தைத்துக் கொடுக்கிறார், புதிய டிசைன்களும் உருவாக்கலாம். பலர் சொந்தக் கடையிலோ வீட்டிலோ வேலை செய்கிறார்கள், சிலர் ஆடைத் தயாரிப்பு நிறுவனங்களில் வேலை செய்கிறார்கள்.
  activities:
    en: [Take measurements and cut cloth, Stitch and finish garments, Do alterations and repairs, Suggest styles and designs to customers]
    ta: [அளவு எடுத்துத் துணியை வெட்டுவது, ஆடைகளைத் தைத்து முடிப்பது, அளவு மாற்றம் மற்றும் பழுது வேலைகளைச் செய்வது, வாடிக்கையாளர்களுக்கு டிசைன் ஆலோசனை சொல்வது]
  skills:
    en: [Accurate measuring, Sewing machine skill, Eye for colour and style, Dealing well with customers]
    ta: [துல்லியமாக அளவெடுக்கும் திறன், தையல் இயந்திரத்தை இயக்கும் திறன், நிறம் மற்றும் டிசைனில் ரசனை, வாடிக்கையாளரிடம் நன்றாகப் பழகும் திறன்]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people learn tailoring through a short course or from an experienced tailor, while fashion design courses exist at diploma and degree level. This is a typical route, not an official requirement.
      ta: பொதுவாக குறுகியகாலப் படிப்பு அல்லது அனுபவமுள்ள தையல்காரரிடம் தையல் கற்கிறார்கள்; ஆடை வடிவமைப்புக்கு டிப்ளமா, பட்டப் படிப்புகளும் உள்ளன. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Learn from an experienced tailor, ta: அனுபவமுள்ள தையல்காரரிடம் கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Tailoring or garment making course, ta: தையல் அல்லது ஆடைத் தயாரிப்புப் படிப்பு}, min_stage: null, opportunity: skill-india-digital-hub-portal}
    - {kind: diploma, title: {en: Fashion design diploma or degree, ta: ஆடை வடிவமைப்பு டிப்ளமா அல்லது பட்டப்படிப்பு}, min_stage: class_12}
  related: [handloom-weaver-craftsperson, small-shop-owner, self-help-group-enterprise]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
  keywords: [tailor, tailoring, தையல், தையல்காரர், fashion design, ஆடை வடிவமைப்பு, boutique, stitching, garments, blouse]
