- slug: photographer-videographer
  family: creative_crafts
  title: {en: Photographer or videographer, ta: போட்டோகிராபர் அல்லது வீடியோகிராபர்}
  description:
    en: Takes photos and records videos for events, families, businesses and media. Also edits the photos and videos before giving them to the customer.
    ta: விழாக்கள், குடும்பங்கள், வணிகங்கள், ஊடகங்களுக்காகப் புகைப்படங்களும் வீடியோக்களும் எடுக்கிறார். வாடிக்கையாளரிடம் கொடுப்பதற்கு முன் அவற்றை எடிட்டும் செய்கிறார்.
  activities:
    en: [Plan shots and set up the camera and lights, Shoot photos and videos at events or studios, Edit photos and videos on a computer, Deliver the final work to customers]
    ta: [படங்களைத் திட்டமிட்டு கேமரா மற்றும் லைட் அமைப்பது, விழாக்களிலோ ஸ்டூடியோவிலோ போட்டோ வீடியோ எடுப்பது, கணினியில் போட்டோ வீடியோ எடிட் செய்வது, முடிந்த வேலையை வாடிக்கையாளருக்குக் கொடுப்பது]
  skills:
    en: [Eye for framing and light, Using a camera and editing software, Dealing well with people, Meeting deadlines]
    ta: [படம் அமைப்பிலும் வெளிச்சத்திலும் ரசனை, கேமரா மற்றும் எடிட்டிங் மென்பொருள் பயன்படுத்தும் திறன், மக்களிடம் நன்றாகப் பழகும் திறன், சொன்ன நேரத்தில் வேலை முடிப்பது]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people learn by assisting a working photographer or through short courses and self-learning, and diploma or degree courses in media also exist. This is a typical route, not an official requirement.
