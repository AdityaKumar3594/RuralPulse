      ta: பொதுவாக தேர்வு மற்றும் உடற்தகுதிச் சோதனைகள் மூலம் தேர்வு நடக்கும்; தேவையான படிப்பு காவல் படை மற்றும் அறிவிப்பைப் பொறுத்தது. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; அதிகாரபூர்வ அறிவிப்பைப் படியுங்கள்.
  routes:
    - {kind: competitive_exam, title: {en: Police recruitment exam and fitness tests, ta: காவலர் தேர்வும் உடற்தகுதிச் சோதனையும்}, min_stage: null}
    - {kind: self_learning, title: {en: Prepare with study material and daily fitness practice, ta: படிப்புப் பொருட்களுடன் தினமும் உடற்பயிற்சி செய்து தயாராகுதல்}, min_stage: null}
