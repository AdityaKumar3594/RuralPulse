# ---------------- technology ----------------
- slug: computer-operator
  family: technology
  title: {en: Computer operator or data entry operator, ta: கணினி இயக்குநர் அல்லது தரவு பதிவாளர்}
  description:
    en: Uses computers to type, enter data, make documents and keep records for offices, shops and service centres. Helps people fill online forms and prints documents.
    ta: அலுவலகம், கடை, சேவை மையங்களுக்காகக் கணினியில் தட்டச்சு செய்வது, தரவு பதிவிடுவது, ஆவணங்கள் தயாரிப்பது, பதிவுகளை வைப்பது ஆகியவற்றைச் செய்கிறார். மக்கள் ஆன்லைன் படிவம் நிரப்ப உதவி, ஆவணங்களை அச்சிடுகிறார்.
  activities:
    en: [Type documents and enter data, Use spreadsheets and basic office software, Help customers with online forms, Print and scan and save files safely]
    ta: [ஆவணங்களைத் தட்டச்சு செய்து தரவு பதிவிடுவது, ஸ்பிரெட்ஷீட் மற்றும் அடிப்படை ஆபீஸ் மென்பொருள் பயன்படுத்துவது, வாடிக்கையாளர்களுக்கு ஆன்லைன் படிவங்களில் உதவுவது, கோப்புகளை அச்சிட்டு ஸ்கேன் செய்து பாதுகாப்பாகச் சேமிப்பது]
  skills:
    en: [Typing speed and accuracy, Basic computer and internet use, Care with details, Honesty with other people's information]
    ta: [தட்டச்சு வேகமும் துல்லியமும், அடிப்படைக் கணினி மற்றும் இணையப் பயன்பாடு, சிறு விவரங்களில் கவனம், பிறரின் தகவல்களில் நேர்மை]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically people take a basic computer course after school, and the education needed varies by employer. This is a typical route, not an official requirement.
      ta: பொதுவாக பள்ளிக்குப் பிறகு அடிப்படைக் கணினிப் படிப்பு படிக்கிறார்கள்; தேவையான படிப்பு நிறுவனத்தைப் பொறுத்து மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: short_course, title: {en: Basic computer course, ta: அடிப்படைக் கணினிப் படிப்பு}, min_stage: class_10, opportunity: skill-india-digital-hub-portal}
    - {kind: iti, title: {en: ITI trade course in computer or office work, ta: கணினி அல்லது அலுவலகப் பணியில் ஐடிஐ தொழிற்பிரிவுப் படிப்பு}, min_stage: class_10}
    - {kind: self_learning, title: {en: Practise typing and office software online, ta: இணையத்தில் தட்டச்சும் ஆபீஸ் மென்பொருளும் பயிற்சி செய்தல்}, min_stage: null}
  related: [software-developer, government-clerk, mobile-phone-repair-technician]
  learning_resources: [skill-india-digital-hub-portal, swayam-portal]
  keywords: [computer, கணினி, data entry, typing, தட்டச்சு, MS Office, computer centre, browsing centre, DTP, ஆபீஸ் வேலை]
  source_refs: []

- slug: mobile-phone-repair-technician
  family: technology
  title: {en: Mobile phone repair technician, ta: மொபைல் போன் பழுதுநீக்கும் நுட்புநர்}
  description:
    en: Finds and fixes problems in mobile phones, such as broken screens, battery issues and software faults. Many run their own small repair shop.
    ta: உடைந்த திரை, பேட்டரி பிரச்சினை, மென்பொருள் கோளாறு போன்ற மொபைல் போன் பிரச்சினைகளைக் கண்டுபிடித்துச் சரிசெய்கிறார். பலர் சொந்தமாகச் சிறிய பழுதுநீக்கும் கடை நடத்துகிறார்கள்.
  activities:
    en: [Check what is wrong with the phone, Replace screens and batteries and other parts, Fix software problems, Explain the problem to the customer]
    ta: [போனில் என்ன பிரச்சினை என்று பார்ப்பது, திரை பேட்டரி போன்ற பாகங்களை மாற்றுவது, மென்பொருள் கோளாறுகளைச் சரிசெய்வது, பிரச்சினையை வாடிக்கையாளருக்கு விளக்குவது]
  skills:
    en: [Fine hand work and patience, Understanding phone parts and software, Careful problem solving, Keeping customer data private]
    ta: [நுணுக்கமான கைவேலையும் பொறுமையும், போன் பாகங்கள் மற்றும் மென்பொருள் பற்றிய புரிதல், கவனமாகப் பிரச்சினையைத் தீர்க்கும் திறன், வாடிக்கையாளரின் தகவல்களை ரகசியமாக வைப்பது]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people learn through a short repair course or by working with an experienced technician, and the education needed varies. This is a typical route, not an official requirement.
      ta: பொதுவாக குறுகியகாலப் பழுதுநீக்கும் படிப்பு அல்லது அனுபவமுள்ள நுட்புநருடன் வேலை செய்து கற்கிறார்கள்; தேவையான படிப்பு மாறுபடும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: short_course, title: {en: Mobile repair training course, ta: மொபைல் பழுதுநீக்கும் பயிற்சிப் படிப்பு}, min_stage: null, opportunity: skill-india-digital-hub-portal}
    - {kind: on_the_job, title: {en: Learn as a helper in a repair shop, ta: பழுதுநீக்கும் கடையில் உதவியாளராகக் கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: iti, title: {en: ITI trade course in electronics, ta: எலக்ட்ரானிக்ஸ் துறையில் ஐடிஐ தொழிற்பிரிவுப் படிப்பு}, min_stage: class_10}
  related: [electrician, computer-operator, small-shop-owner]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
  keywords: [mobile repair, phone repair, மொபைல் ரிப்பேர், போன் பழுது, screen change, electronics, எலக்ட்ரானிக்ஸ், mobile shop, technician, cell phone]
  source_refs: []

- slug: software-developer
  family: technology
  title: {en: Software developer, ta: மென்பொருள் உருவாக்குநர்}
  description:
    en: Writes computer programs and builds apps and websites that people and businesses use. Finds and fixes errors in the code and works with a team.
    ta: மக்களும் நிறுவனங்களும் பயன்படுத்தும் கணினி நிரல்கள், ஆப்கள், இணையதளங்களை எழுதி உருவாக்குகிறார். நிரலில் உள்ள பிழைகளைக் கண்டுபிடித்துச் சரிசெய்து, குழுவுடன் இணைந்து வேலை செய்கிறார்.
  activities:
    en: [Write and test code, Find and fix errors, Work with a team on a project, Keep learning new tools and languages]
    ta: [நிரல் எழுதிச் சோதிப்பது, பிழைகளைக் கண்டுபிடித்துச் சரிசெய்வது, ஒரு திட்டத்தில் குழுவுடன் வேலை செய்வது, புதிய கருவிகளையும் மொழிகளையும் தொடர்ந்து கற்பது]
  skills:
    en: [Logical thinking and problem solving, Maths and reading skill, Patience with errors, Willingness to keep learning]
    ta: [தர்க்க ரீதியாகச் சிந்தித்துப் பிரச்சினையைத் தீர்க்கும் திறன், கணிதமும் படிக்கும் திறனும், பிழைகளில் பொறுமை, தொடர்ந்து கற்கும் மனம்]
  entry:
    typical_min_stage: undergraduate
    notes:
      en: Typically many developers have a degree or diploma in computers or a related field, while some learn through self-study and projects. This is a typical route, not an official requirement, and employers differ.
      ta: பொதுவாக பல மென்பொருள் உருவாக்குநர்கள் கணினி அல்லது தொடர்புடைய துறையில் பட்டம் அல்லது டிப்ளமா பெற்றிருப்பார்கள்; சிலர் சுயமாகக் கற்று திட்டங்கள் செய்தும் வருகிறார்கள். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; நிறுவனங்கள் வேறுபடும்.
  routes:
    - {kind: degree, title: {en: Computer science or related degree, ta: கணினி அறிவியல் அல்லது தொடர்புடைய பட்டப்படிப்பு}, min_stage: class_12}
    - {kind: diploma, title: {en: Computer or IT diploma, ta: கணினி அல்லது ஐடி டிப்ளமா}, min_stage: class_10}
    - {kind: self_learning, title: {en: Learn programming online and build small projects, ta: இணையத்தில் புரோகிராமிங் கற்று சிறு திட்டங்கள் செய்தல்}, min_stage: null, opportunity: swayam-portal}
  related: [computer-operator, mobile-phone-repair-technician, vocational-trainer]
  learning_resources: [swayam-portal, skill-india-digital-hub-portal]
  keywords: [software, programmer, coding, மென்பொருள், புரோகிராமிங், IT job, app development, website, computer science, engineer]
  source_refs: []

# ---------------- hospitality ----------------
- slug: cook-chef
  family: hospitality
  title: {en: Cook or chef, ta: சமையல்காரர் அல்லது செஃப்}
  description:
    en: Prepares food in hotels, restaurants, canteens, catering teams or small food stalls. Plans the menu, cooks with care for taste and cleanliness, and works with a kitchen team.
    ta: ஹோட்டல், உணவகம், கேன்டீன், கேட்டரிங் குழு, சிறு உணவுக் கடைகளில் உணவு தயாரிக்கிறார். மெனுவைத் திட்டமிட்டு, சுவையிலும் சுத்தத்திலும் கவனமாகச் சமைத்து, சமையலறைக் குழுவுடன் வேலை செய்கிறார்.
  activities:
    en: [Prepare and cook dishes, Plan quantities and buy ingredients, Keep the kitchen clean and safe, Work with the team during busy hours]
    ta: [உணவு வகைகளைத் தயாரித்துச் சமைப்பது, அளவுகளைத் திட்டமிட்டு பொருட்கள் வாங்குவது, சமையலறையைச் சுத்தமாகவும் பாதுகாப்பாகவும் வைப்பது, நெருக்கடியான நேரங்களில் குழுவுடன் வேலை செய்வது]
  skills:
