      en: Typically people start small at home or in a group after learning a recipe or a training, and selling food usually needs some registration or licence. This is a typical route, not an official requirement, so check the current rules.
      ta: பொதுவாக ஒரு செய்முறை அல்லது பயிற்சி கற்ற பிறகு வீட்டிலோ குழுவிலோ சிறிதாகத் தொடங்குகிறார்கள்; உணவு விற்க பொதுவாக பதிவு அல்லது உரிமம் தேவைப்படும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய விதிகளைப் பாருங்கள்.
  routes:
    - {kind: short_course, title: {en: Food processing training, ta: உணவுப் பதப்படுத்துதல் பயிற்சி}, min_stage: null, opportunity: skill-india-digital-hub-portal}
    - {kind: on_the_job, title: {en: Learn at a small food unit, ta: சிறிய உணவுத் தயாரிப்பு நிறுவனத்தில் கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: diploma, title: {en: Food technology diploma or degree, ta: உணவுத் தொழில்நுட்ப டிப்ளமா அல்லது பட்டப்படிப்பு}, min_stage: class_12}
  related: [self-help-group-enterprise, crop-farmer, small-shop-owner]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
