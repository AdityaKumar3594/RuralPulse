# ---------------- education ----------------
- slug: primary-school-teacher
  family: education
  title: {en: Primary school teacher, ta: தொடக்கப்பள்ளி ஆசிரியர்}
  description:
    en: Teaches young children basic subjects such as language, maths and environment in a school. Helps children learn to read, write and think, and works with parents.
    ta: பள்ளியில் சிறு குழந்தைகளுக்கு மொழி, கணிதம், சுற்றுச்சூழல் போன்ற அடிப்படைப் பாடங்களைக் கற்றுக்கொடுக்கிறார். குழந்தைகள் படிக்கவும் எழுதவும் சிந்திக்கவும் உதவி, பெற்றோருடன் இணைந்து செயல்படுகிறார்.
  activities:
    en: [Plan and teach lessons, Check children's notebooks and progress, Use stories and games and activities to teach, Talk with parents about their child]
    ta: [பாடங்களைத் திட்டமிட்டுக் கற்றுக்கொடுப்பது, குழந்தைகளின் நோட்டுப் புத்தகங்களையும் முன்னேற்றத்தையும் பார்ப்பது, கதை விளையாட்டு செயல்பாடுகள் மூலம் கற்பிப்பது, குழந்தையைப் பற்றி பெற்றோருடன் பேசுவது]
  skills:
    en: [Patience with children, Clear speaking and explaining, Good basic subject knowledge, Organising a classroom]
    ta: [குழந்தைகளிடம் பொறுமை, தெளிவாகப் பேசி விளக்கும் திறன், அடிப்படைப் பாட அறிவு, வகுப்பறையை ஒழுங்காக நடத்தும் திறன்]
  entry:
    typical_min_stage: class_12
    notes:
      en: Typically a teacher training course after Class 12 or a degree plus teacher training is the route, and government teaching posts usually need an eligibility test. This is a typical route, not an official requirement, so check the current notice.
      ta: பொதுவாக 12ஆம் வகுப்புக்குப் பிறகு ஆசிரியர் பயிற்சிப் படிப்பு அல்லது பட்டம் மற்றும் ஆசிரியர் பயிற்சி ஒரு வழி; அரசு ஆசிரியர் பணிகளுக்குப் பொதுவாக தகுதித் தேர்வு தேவைப்படும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய அறிவிப்பைப் பாருங்கள்.
  routes:
    - {kind: diploma, title: {en: Teacher training diploma, ta: ஆசிரியர் பயிற்சி டிப்ளமா}, min_stage: class_12}
    - {kind: degree, title: {en: Degree followed by teacher education, ta: பட்டப்படிப்புக்குப் பின் ஆசிரியர் கல்விப் படிப்பு}, min_stage: undergraduate}
    - {kind: competitive_exam, title: {en: Teacher eligibility or recruitment test, ta: ஆசிரியர் தகுதித் தேர்வு அல்லது பணியமர்வுத் தேர்வு}, min_stage: null}
  related: [early-childhood-educator, vocational-trainer, government-clerk]
