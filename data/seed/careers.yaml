    ta: [சமையல் திறனும் சுவை உணர்வும், சுத்தமும் உணவுப் பாதுகாப்பும், குழுவுடன் வேகமாக வேலை செய்வது, சரக்குகளைத் திட்டமிட்டு நிர்வகிப்பது]
  entry:
