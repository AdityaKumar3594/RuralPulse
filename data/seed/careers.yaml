- slug: self-help-group-enterprise
  family: business
  title: {en: Self-help group micro-enterprise, ta: சுய உதவிக் குழு சிறு தொழில்}
  description:
    en: Works with a group of neighbours to run a small business together, such as making products, running a service or selling goods. The group saves together, shares work and makes decisions together.
    ta: அக்கம்பக்கத்தினர் குழுவாக இணைந்து பொருட்கள் செய்வது, சேவை செய்வது, பொருட்கள் விற்பது போன்ற சிறு தொழிலை நடத்துகிறார்கள். குழு சேர்ந்து சேமித்து, வேலையைப் பகிர்ந்து, முடிவுகளை ஒன்றாக எடுக்கிறது.
  activities:
    en: [Hold group meetings and decide work together, Make products or offer a service, Keep group savings and accounts, Find markets and sell together]
    ta: [குழுக் கூட்டங்கள் நடத்தி வேலைகளை ஒன்றாக முடிவு செய்வது, பொருட்கள் செய்வது அல்லது சேவை வழங்குவது, குழுவின் சேமிப்பையும் கணக்கையும் வைத்திருப்பது, சந்தையைக் கண்டுபிடித்து சேர்ந்து விற்பது]
  skills:
    en: [Teamwork and trust, Keeping honest accounts, Leading and listening in a group, A skill in a product or service]
    ta: [குழுவாக வேலை செய்வதும் நம்பிக்கையும், நேர்மையாகக் கணக்கு வைப்பது, குழுவில் வழிநடத்தவும் கவனிக்கவும் தெரிவது, ஒரு பொருள் அல்லது சேவையில் திறன்]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people join or form a group in their village, and no fixed qualification is needed. Group rules and support schemes vary by place. This is a typical route, not an official requirement.
      ta: பொதுவாக தங்கள் கிராமத்தில் ஒரு குழுவில் சேர்கிறார்கள் அல்லது புதிதாக உருவாக்குகிறார்கள்; குறிப்பிட்ட படிப்பு தேவையில்லை. குழு விதிகளும் ஆதரவுத் திட்டங்களும் இடத்துக்கு இடம் மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Join an existing group in your area, ta: உங்கள் பகுதியில் உள்ள குழுவில் சேர்ந்து கற்றல்}, min_stage: null}
    - {kind: short_course, title: {en: Skill or enterprise training for groups, ta: குழுக்களுக்கான திறன் அல்லது தொழில் பயிற்சி}, min_stage: null, opportunity: skill-india-digital-hub-portal}
  related: [food-processing-entrepreneur, tailor-fashion-designer, handloom-weaver-craftsperson]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
  keywords: [self help group, SHG, சுய உதவிக் குழு, மகளிர் குழு, micro business, small business, group business, சிறு தொழில், village business, women group]
