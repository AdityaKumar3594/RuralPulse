- slug: tourist-guide
  family: hospitality
  title: {en: Tourist guide, ta: சுற்றுலா வழிகாட்டி}
  description:
    en: Takes visitors around places like temples, forts, nature spots and villages, and tells them about the place, its history and culture. Helps visitors have a safe and smooth trip.
    ta: கோயில், கோட்டை, இயற்கை இடங்கள், கிராமங்கள் போன்ற இடங்களுக்கு வருகையாளர்களை அழைத்துச் சென்று, அந்த இடம், அதன் வரலாறு, பண்பாடு பற்றிச் சொல்கிறார். வருகையாளர்கள் பாதுகாப்பாகவும் சுமுகமாகவும் பயணம் செய்ய உதவுகிறார்.
  activities:
    en: [Plan the route and visit timings, Explain the history and stories of the place, Help visitors with directions and safety, Talk with visitors in their language]
    ta: [பயணப் பாதையையும் நேரத்தையும் திட்டமிடுவது, அந்த இடத்தின் வரலாற்றையும் கதைகளையும் விளக்குவது, வழி மற்றும் பாதுகாப்பில் வருகையாளர்களுக்கு உதவுவது, வருகையாளர்களிடம் அவர்கள் மொழியில் பேசுவது]
  skills:
    en: [Knowledge of local places and history, Clear and friendly speaking, Knowing more than one language, Responsibility for a group]
    ta: [உள்ளூர் இடங்கள் மற்றும் வரலாறு பற்றிய அறிவு, தெளிவாகவும் நட்புடனும் பேசும் திறன், ஒன்றுக்கு மேற்பட்ட மொழி தெரிவது, குழுவுக்கான பொறுப்பு]
  entry:
    typical_min_stage: null
    notes:
      en: Typically guides learn the local places well and many take a guide training or approval where required, which varies by place. This is a typical route, not an official requirement, so check locally.
      ta: பொதுவாக வழிகாட்டிகள் உள்ளூர் இடங்களை நன்றாகக் கற்கிறார்கள்; தேவைப்படும் இடங்களில் வழிகாட்டிப் பயிற்சி அல்லது அனுமதி பெறுகிறார்கள், இது இடத்துக்கு இடம் மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; உள்ளூரில் விசாரியுங்கள்.
  routes:
    - {kind: self_learning, title: {en: Study local history and practise speaking with visitors, ta: உள்ளூர் வரலாற்றைப் படித்து வருகையாளர்களுடன் பேசிப் பழகுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Tourist guide or tourism training course, ta: சுற்றுலா வழிகாட்டி அல்லது சுற்றுலாப் பயிற்சிப் படிப்பு}, min_stage: class_10}
    - {kind: degree, title: {en: Tourism or history related degree, ta: சுற்றுலா அல்லது வரலாறு தொடர்பான பட்டப்படிப்பு}, min_stage: class_12}
