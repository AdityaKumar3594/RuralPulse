    - {kind: short_course, title: {en: Hospitality or front office short course, ta: விருந்தோம்பல் அல்லது வரவேற்புப் பணிக் குறுகியகாலப் படிப்பு}, min_stage: class_10, opportunity: skill-india-digital-hub-portal}
    - {kind: diploma, title: {en: Hotel management diploma or degree, ta: ஹோட்டல் மேலாண்மை டிப்ளமா அல்லது பட்டப்படிப்பு}, min_stage: class_12}
