# Career seed. Descriptions say what the work IS; no pay, counts or demand claims.
# Entry stages and routes are typical paths, not official requirements. Tamil awaits native-speaker review.

# ---------------- agriculture ----------------
- slug: crop-farmer
  family: agriculture
  title: {en: Crop and organic farmer, ta: பயிர் மற்றும் இயற்கை விவசாயி}
  description:
    en: Grows crops such as grains, vegetables or fruits on farmland, either with usual methods or with organic methods. Plans the season, looks after the soil and plants, and sells the harvest.
    ta: நெல், காய்கறி, பழம் போன்ற பயிர்களை நிலத்தில் விளைவிக்கிறார். வழக்கமான முறையிலோ இயற்கை முறையிலோ பயிரிட்டு, மண்ணையும் பயிரையும் பராமரித்து, விளைச்சலை விற்கிறார்.
  activities:
    en: [Prepare the land and sow seeds, Water the crops and control weeds and pests, Harvest and store the produce, Sell the produce and keep farm records]
    ta: [நிலத்தைத் தயார் செய்து விதை விதைப்பது, பயிருக்கு நீர் பாய்ச்சி களை மற்றும் பூச்சிகளைக் கட்டுப்படுத்துவது, அறுவடை செய்து விளைபொருளைச் சேமிப்பது, விளைபொருளை விற்று பண்ணைக் கணக்கு வைப்பது]
  skills:
    en: [Knowledge of soil and seasons, Patience and hard work, Basic record keeping, Willingness to try new methods]
    ta: [மண் மற்றும் பருவம் பற்றிய அறிவு, பொறுமையும் உழைப்பும், அடிப்படைக் கணக்கு வைக்கும் திறன், புதிய முறைகளை முயன்று பார்க்கும் மனம்]
  entry:
    typical_min_stage: null
    notes:
      en: Typically many farmers learn by working on the family or a local farm. No formal qualification is usually needed, though farming courses exist. This is a typical route, not an official requirement.
      ta: பொதுவாக குடும்ப நிலத்திலோ உள்ளூர் பண்ணையிலோ வேலை செய்து கற்றுக்கொள்கிறார்கள். முறையான படிப்பு பெரும்பாலும் தேவையில்லை, ஆனால் விவசாயப் படிப்புகளும் உள்ளன. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Learn by working on a farm, ta: பண்ணையில் வேலை செய்து கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Short farming or organic farming training, ta: விவசாயம் அல்லது இயற்கை விவசாயப் பயிற்சி}, min_stage: null}
    - {kind: degree, title: {en: Agriculture degree or diploma, ta: வேளாண்மைப் பட்டம் அல்லது டிப்ளமா}, min_stage: class_12}
  related: [dairy-farmer, agricultural-extension-worker, food-processing-entrepreneur]
  learning_resources: [skill-india-digital-hub-portal]
  keywords: [farming, farmer, விவசாயம், விவசாயி, organic farming, இயற்கை விவசாயம், crops, பயிர், paddy, agriculture]
  source_refs: []

- slug: dairy-farmer
  family: agriculture
  title: {en: Dairy farmer, ta: பால் பண்ணையாளர்}
  description:
    en: Keeps cows or buffaloes and collects their milk. Looks after the animals' feed, health and shelter, and supplies milk to local buyers or dairy groups.
    ta: பசு, எருமை வளர்த்து பால் கறக்கிறார். மாடுகளுக்குத் தீவனம், உடல்நலம், கொட்டகை ஆகியவற்றைக் கவனித்து, பாலை உள்ளூர் வாங்குபவர்களுக்கோ பால் சங்கங்களுக்கோ கொடுக்கிறார்.
  activities:
    en: [Feed and clean the animals, Milk the animals and keep milk clean, Watch animal health and call a vet when needed, Supply milk and keep simple accounts]
    ta: [மாடுகளுக்குத் தீவனம் போட்டு சுத்தம் செய்வது, பால் கறந்து சுத்தமாக வைத்திருப்பது, மாடுகளின் உடல்நலத்தைக் கவனித்து தேவைப்படும்போது கால்நடை மருத்துவரை அழைப்பது, பாலை கொடுத்து எளிய கணக்கு வைப்பது]
  skills:
    en: [Caring for animals, Early morning routine and discipline, Basic knowledge of animal feed and health, Simple accounts]
    ta: [விலங்குகளைப் பராமரிக்கும் திறன், அதிகாலை எழுந்து வேலை செய்யும் ஒழுக்கம், தீவனம் மற்றும் நலம் பற்றிய அடிப்படை அறிவு, எளிய கணக்கு]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people start by learning from family or neighbours who keep animals. Formal qualification varies and is often not needed. This is a typical route, not an official requirement.
      ta: பொதுவாக மாடு வளர்க்கும் குடும்பத்தினர் அல்லது அக்கம்பக்கத்தாரிடம் கற்றுத் தொடங்குகிறார்கள். படிப்புத் தேவை மாறுபடும், பெரும்பாலும் தேவையில்லை. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Learn on a dairy farm or from experienced keepers, ta: பால் பண்ணையிலோ அனுபவமுள்ளவர்களிடமோ கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Short dairy or animal care training, ta: பால் தொழில் அல்லது கால்நடைப் பராமரிப்புக் குறுகியகாலப் பயிற்சி}, min_stage: null}
  related: [crop-farmer, agricultural-extension-worker, food-processing-entrepreneur]
  learning_resources: [skill-india-digital-hub-portal]
  keywords: [dairy, milk, பால், பசு, cow, மாடு வளர்ப்பு, cattle, animal farming, கால்நடை, buffalo]
  source_refs: []

- slug: agricultural-extension-worker
  family: agriculture
  title: {en: Agricultural extension worker, ta: வேளாண் விரிவாக்கப் பணியாளர்}
  description:
    en: Helps farmers by sharing farming advice, new methods and information about government schemes. Visits villages and fields and connects farmers with agriculture offices.
    ta: விவசாயிகளுக்கு விவசாய ஆலோசனை, புதிய முறைகள், அரசுத் திட்டங்கள் பற்றிய தகவல்களைச் சொல்லி உதவுகிறார். கிராமங்களுக்கும் வயல்களுக்கும் சென்று விவசாயிகளை வேளாண் அலுவலகங்களுடன் இணைக்கிறார்.
  activities:
    en: [Visit farms and talk to farmers, Explain new crop methods and good practices, Tell farmers about schemes they can ask about, Help farmers with problems like pests or soil, Keep field visit notes]
    ta: [வயல்களுக்குச் சென்று விவசாயிகளிடம் பேசுவது, புதிய பயிர் முறைகளையும் நல்ல வழிகளையும் விளக்குவது, விவசாயிகள் கேட்டுப் பெறக்கூடிய திட்டங்களைப் பற்றிச் சொல்வது, பூச்சி மண் போன்ற பிரச்சினைகளுக்கு உதவுவது, களப்பயணக் குறிப்புகளை எழுதி வைப்பது]
  skills:
    en: [Good knowledge of farming, Clear speaking and listening, Travelling to villages, Basic writing and reporting]
    ta: [விவசாயத்தில் நல்ல அறிவு, தெளிவாகப் பேசி கவனிக்கும் திறன், கிராமங்களுக்குப் பயணிக்கும் மனம், அடிப்படை எழுத்து மற்றும் அறிக்கை எழுதும் திறன்]
  entry:
    typical_min_stage: iti_or_diploma
    notes:
      en: Typically an agriculture diploma or degree is a common route, and government posts usually have their own rules. This is a typical route, not an official requirement, so check the official notice.
      ta: பொதுவாக வேளாண்மை டிப்ளமா அல்லது பட்டம் ஒரு பொதுவான வழி; அரசுப் பணிகளுக்குத் தனி விதிகள் இருக்கும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல, எனவே அதிகாரபூர்வ அறிவிப்பைப் பாருங்கள்.
  routes:
    - {kind: diploma, title: {en: Agriculture diploma, ta: வேளாண்மை டிப்ளமா}, min_stage: class_10}
    - {kind: degree, title: {en: Agriculture degree, ta: வேளாண்மைப் பட்டப்படிப்பு}, min_stage: class_12}
    - {kind: competitive_exam, title: {en: Government recruitment exam for agriculture posts, ta: வேளாண் பணிகளுக்கான அரசுத் தேர்வு}, min_stage: null}
  related: [crop-farmer, dairy-farmer, vocational-trainer]
  learning_resources: [swayam-portal, ncs-portal]
  keywords: [agriculture officer, extension, வேளாண்மை, விவசாய ஆலோசகர், farm advisor, agri diploma, வேளாண் அலுவலர், village work]
  source_refs: []

# ---------------- skilled_trades ----------------
- slug: electrician
  family: skilled_trades
  title: {en: Electrician, ta: எலக்ட்ரீஷியன்}
  description:
    en: Installs, checks and repairs electrical wiring and equipment in homes, shops, farms and factories. Works safely with electricity to find and fix faults.
    ta: வீடு, கடை, பண்ணை, தொழிற்சாலை ஆகியவற்றில் மின் வயரிங் மற்றும் மின் சாதனங்களைப் பொருத்தி, சோதித்து, பழுது பார்க்கிறார். பாதுகாப்பாக மின்சாரத்துடன் வேலை செய்து கோளாறுகளைக் கண்டுபிடித்துச் சரிசெய்கிறார்.
  activities:
    en: [Fit wiring and switches and fans, Find and repair electrical faults, Repair or install motors and pumps, Follow safety steps on every job]
    ta: [வயரிங் சுவிட்ச் மற்றும் மின்விசிறி பொருத்துவது, மின் கோளாறுகளைக் கண்டுபிடித்துச் சரிசெய்வது, மோட்டார் மற்றும் பம்ப் செட்டைப் பழுது பார்ப்பது அல்லது பொருத்துவது, ஒவ்வொரு வேலையிலும் பாதுகாப்பு முறைகளைப் பின்பற்றுவது]
  skills:
    en: [Understanding of circuits, Careful and safe working habits, Using testers and hand tools, Reading simple diagrams]
    ta: [மின் இணைப்புகள் பற்றிய புரிதல், கவனமும் பாதுகாப்பான வேலைப் பழக்கமும், டெஸ்டர் மற்றும் கைக்கருவிகளைப் பயன்படுத்தும் திறன், எளிய வரைபடங்களைப் படிக்கும் திறன்]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically people join an ITI trade course after Class 10 or learn as a helper with an experienced electrician. This is a typical route, not an official requirement, and licence rules can vary.
      ta: பொதுவாக 10ஆம் வகுப்புக்குப் பிறகு ஐடிஐ படிப்பில் சேர்கிறார்கள் அல்லது அனுபவமுள்ள எலக்ட்ரீஷியனிடம் உதவியாளராகக் கற்கிறார்கள். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; உரிமம் விதிகள் மாறுபடலாம்.
  routes:
    - {kind: iti, title: {en: ITI trade course in this field, ta: இந்தத் துறையில் ஐடிஐ தொழிற்பிரிவுப் படிப்பு}, min_stage: class_10}
    - {kind: apprenticeship, title: {en: Apprenticeship with an employer, ta: நிறுவனத்தில் தொழில் பழகுநர் பயிற்சி}, min_stage: class_10, opportunity: apprenticeship-india-portal}
    - {kind: on_the_job, title: {en: Work as a helper and learn on the job, ta: உதவியாளராக வேலை செய்து கற்றுக்கொள்ளுதல்}, min_stage: null}
  related: [welder, automobile-mechanic, mobile-phone-repair-technician]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
  keywords: [electrician, electrical, wiring, எலக்ட்ரீஷியன், மின்சாரம், current work, ITI, motor repair, மின் வேலை]
  source_refs: []

- slug: welder
  family: skilled_trades
  title: {en: Welder, ta: வெல்டர்}
  description:
    en: Joins metal parts using heat and special equipment to make or repair gates, grills, frames, machines and structures. Works with care to stay safe from heat, sparks and fumes.
    ta: வெப்பமும் சிறப்புக் கருவிகளும் பயன்படுத்தி உலோகப் பாகங்களை இணைத்து கேட், கிரில், சட்டம், இயந்திரம், கட்டமைப்புகளைச் செய்கிறார் அல்லது பழுது பார்க்கிறார். வெப்பம், தீப்பொறி, புகையிலிருந்து பாதுகாப்பாக இருக்கக் கவனமாக வேலை செய்கிறார்.
  activities:
    en: [Measure and cut metal pieces, Join metal parts by welding, Repair broken metal items, Wear safety gear and check equipment]
    ta: [உலோகத் துண்டுகளை அளந்து வெட்டுவது, வெல்டிங் மூலம் உலோகப் பாகங்களை இணைப்பது, உடைந்த உலோகப் பொருட்களைப் பழுது பார்ப்பது, பாதுகாப்புக் கவசம் அணிந்து கருவிகளைச் சோதிப்பது]
  skills:
    en: [Steady hands and good eyesight, Reading simple drawings and measurements, Safety awareness, Patience and accuracy]
    ta: [நிலையான கை மற்றும் நல்ல பார்வை, எளிய வரைபடம் மற்றும் அளவுகளைப் படிக்கும் திறன், பாதுகாப்பு விழிப்புணர்வு, பொறுமையும் துல்லியமும்]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically people join an ITI trade course or start as a helper in a workshop. Requirements vary by course and employer. This is a typical route, not an official requirement.
      ta: பொதுவாக ஐடிஐ தொழிற்பிரிவில் சேர்கிறார்கள் அல்லது பட்டறையில் உதவியாளராகத் தொடங்குகிறார்கள். படிப்பு மற்றும் நிறுவனத்தைப் பொறுத்து தேவைகள் மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: iti, title: {en: ITI trade course in this field, ta: இந்தத் துறையில் ஐடிஐ தொழிற்பிரிவுப் படிப்பு}, min_stage: class_10}
    - {kind: apprenticeship, title: {en: Apprenticeship with an employer, ta: நிறுவனத்தில் தொழில் பழகுநர் பயிற்சி}, min_stage: class_10, opportunity: apprenticeship-india-portal}
