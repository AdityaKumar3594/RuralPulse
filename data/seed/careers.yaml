    - {kind: short_course, title: {en: Logistics and warehouse skill course, ta: சரக்குப் போக்குவரத்து மற்றும் கிடங்குத் திறன் படிப்பு}, min_stage: class_10, opportunity: skill-india-digital-hub-portal}
