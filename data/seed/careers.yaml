- slug: police-constable
  family: public_service
  title: {en: Police constable, ta: காவலர்}
  description:
    en: Works in the police force to keep order, help people and prevent crime. Does patrol, traffic and station duties.
    ta: காவல் துறையில் ஒழுங்கைக் காத்து, மக்களுக்கு உதவி, குற்றங்களைத் தடுக்கும் பணி செய்கிறார். ரோந்து, போக்குவரத்து, காவல் நிலையப் பணிகளைச் செய்கிறார்.
  activities:
    en: [Patrol an area and help people in need, Manage traffic and crowds, Record complaints at the station, Assist in checking and keeping records]
    ta: [ஒரு பகுதியில் ரோந்து சென்று தேவைப்படுபவர்களுக்கு உதவுவது, போக்குவரத்தையும் கூட்டத்தையும் ஒழுங்குபடுத்துவது, காவல் நிலையத்தில் புகார்களைப் பதிவு செய்வது, விசாரணை மற்றும் பதிவுகளில் உதவுவது]
  skills:
    en: [Physical fitness, Discipline and responsibility, Staying calm under pressure, Speaking politely and firmly]
    ta: [உடல் தகுதி, ஒழுக்கமும் பொறுப்பும், அழுத்தத்திலும் அமைதியாக இருப்பது, மரியாதையாகவும் உறுதியாகவும் பேசும் திறன்]
  entry:
    typical_min_stage: class_12
