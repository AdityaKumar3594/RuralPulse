- slug: automobile-mechanic
  family: skilled_trades
  title: {en: Automobile mechanic, ta: ஆட்டோமொபைல் மெக்கானிக்}
  description:
    en: Checks, services and repairs vehicles such as bikes, autos, cars and tractors. Finds out why a vehicle has a problem and fixes it.
    ta: பைக், ஆட்டோ, கார், டிராக்டர் போன்ற வாகனங்களைச் சோதித்து, சர்வீஸ் செய்து, பழுது பார்க்கிறார். வாகனத்தில் என்ன பிரச்சினை என்று கண்டுபிடித்துச் சரிசெய்கிறார்.
  activities:
    en: [Service engines and brakes and tyres, Find the cause of a vehicle problem, Replace worn parts, Keep the workshop tools and area in order]
    ta: [என்ஜின் பிரேக் டயர்களை சர்வீஸ் செய்வது, வாகனப் பிரச்சினைக்கான காரணத்தைக் கண்டுபிடிப்பது, தேய்ந்த பாகங்களை மாற்றுவது, பட்டறைக் கருவிகளையும் இடத்தையும் ஒழுங்காக வைப்பது]
  skills:
    en: [Understanding how engines work, Using tools correctly, Patient problem solving, Talking clearly with customers]
    ta: [என்ஜின் எப்படி வேலை செய்கிறது என்ற புரிதல், கருவிகளைச் சரியாகப் பயன்படுத்தும் திறன், பொறுமையாகப் பிரச்சினையைத் தீர்க்கும் திறன், வாடிக்கையாளரிடம் தெளிவாகப் பேசும் திறன்]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically people join an ITI trade course after Class 10 or learn as a helper in a garage. This is a typical route, not an official requirement, and it varies by employer.
