- slug: early-childhood-educator
  family: education
  title: {en: Early childhood educator (anganwadi or preschool), ta: குழந்தைப் பருவக் கல்வியாளர் (அங்கன்வாடி அல்லது மழலையர் பள்ளி)}
  description:
    en: Looks after and teaches very young children through play, songs and stories in an anganwadi or preschool. Helps children get ready for school and keeps them safe and happy.
    ta: அங்கன்வாடி அல்லது மழலையர் பள்ளியில் விளையாட்டு, பாட்டு, கதைகள் மூலம் மிகச் சிறிய குழந்தைகளைக் கவனித்துக் கற்றுக்கொடுக்கிறார். குழந்தைகளைப் பள்ளிக்குத் தயார்படுத்தி, பாதுகாப்பாகவும் மகிழ்ச்சியாகவும் வைத்திருக்கிறார்.
  activities:
    en: [Run play and learning activities, Teach songs and stories and simple letters and numbers, Keep children safe and clean, Talk with parents about the child's growth]
    ta: [விளையாட்டு மற்றும் கற்றல் செயல்பாடுகளை நடத்துவது, பாட்டு கதை எளிய எழுத்து எண்களைக் கற்றுக்கொடுப்பது, குழந்தைகளைப் பாதுகாப்பாகவும் சுத்தமாகவும் வைப்பது, குழந்தையின் வளர்ச்சி பற்றி பெற்றோருடன் பேசுவது]
  skills:
    en: [Love and patience with children, Storytelling and singing, Basic care and hygiene, Talking well with parents]
    ta: [குழந்தைகளிடம் அன்பும் பொறுமையும், கதை சொல்லவும் பாடவும் தெரிவது, அடிப்படைப் பராமரிப்பும் சுகாதாரமும், பெற்றோரிடம் நன்றாகப் பேசும் திறன்]
  entry:
    typical_min_stage: null
    notes:
      en: Typically the needed schooling and training vary by employer and by government scheme, and early childhood education courses exist after school. This is a typical route, not an official requirement, so check the current notice.
      ta: பொதுவாக தேவையான படிப்பும் பயிற்சியும் நிறுவனம் மற்றும் அரசுத் திட்டத்தைப் பொறுத்து மாறும்; பள்ளிக்குப் பிறகு குழந்தைப் பருவக் கல்விப் படிப்புகளும் உள்ளன. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய அறிவிப்பைப் பாருங்கள்.
  routes:
    - {kind: short_course, title: {en: Early childhood care and education course, ta: குழந்தைப் பருவப் பராமரிப்பு மற்றும் கல்விப் படிப்பு}, min_stage: null}
    - {kind: diploma, title: {en: Early childhood education diploma, ta: குழந்தைப் பருவக் கல்வி டிப்ளமா}, min_stage: class_12}
    - {kind: on_the_job, title: {en: Start as a helper in a preschool or centre, ta: மழலையர் பள்ளி அல்லது மையத்தில் உதவியாளராகத் தொடங்குதல்}, min_stage: null}
  related: [primary-school-teacher, nurse, self-help-group-enterprise]
  learning_resources: [diksha-portal]
  keywords: [anganwadi, அங்கன்வாடி, preschool, nursery, மழலையர் பள்ளி, child care, kids, குழந்தைகள், playschool, ECCE]
  source_refs: []

- slug: vocational-trainer
  family: education
  title: {en: Vocational trainer, ta: தொழிற்பயிற்சி ஆசிரியர்}
  description:
    en: Teaches practical job skills such as a trade, a craft or computer work to learners in training centres. Shows learners how to do the work and checks their progress.
    ta: பயிற்சி மையங்களில் ஒரு தொழில், கைவினை, கணினி வேலை போன்ற செயல்முறைத் திறன்களைக் கற்பிக்கிறார். வேலையை எப்படிச் செய்வது என்று செய்து காட்டி, கற்பவர்களின் முன்னேற்றத்தைப் பார்க்கிறார்.
  activities:
    en: [Demonstrate skills step by step, Guide learners in practice sessions, Check learners' work and give feedback, Keep training tools safe and ready]
    ta: [திறன்களைப் படிப்படியாகச் செய்து காட்டுவது, பயிற்சி நேரத்தில் கற்பவர்களுக்கு வழிகாட்டுவது, கற்பவர்களின் வேலையைப் பார்த்து கருத்து சொல்வது, பயிற்சிக் கருவிகளைப் பாதுகாப்பாகத் தயாராக வைப்பது]
  skills:
    en: [Strong practical skill in one trade, Clear explaining and showing, Patience, Planning a lesson]
    ta: [ஒரு தொழிலில் வலுவான செயல்முறைத் திறன், தெளிவாக விளக்கிக் காட்டும் திறன், பொறுமை, பாடத்தைத் திட்டமிடும் திறன்]
  entry:
    typical_min_stage: iti_or_diploma
    notes:
      en: Typically trainers first gain skill and work experience in their trade and then take a trainer course, but this varies by institution. This is a typical route, not an official requirement.
      ta: பொதுவாக பயிற்றுநர்கள் முதலில் தங்கள் தொழிலில் திறனும் அனுபவமும் பெற்று, பிறகு பயிற்றுநர் படிப்பு படிக்கிறார்கள்; நிறுவனத்தைப் பொறுத்து மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Gain work experience in a trade first, ta: முதலில் ஒரு தொழிலில் வேலை அனுபவம் பெறுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Trainer or instructor course, ta: பயிற்றுநர் படிப்பு}, min_stage: iti_or_diploma, opportunity: skill-india-digital-hub-portal}
    - {kind: iti, title: {en: ITI or diploma in your own trade, ta: உங்கள் தொழிலில் ஐடிஐ அல்லது டிப்ளமா}, min_stage: class_10}
  related: [primary-school-teacher, electrician, computer-operator]
  learning_resources: [skill-india-digital-hub-portal, tn-skill-development-portal]
  keywords: [trainer, instructor, skill training, பயிற்சியாளர், ITI instructor, teaching skills, தொழிற்பயிற்சி, training centre, coach]
  source_refs: []

