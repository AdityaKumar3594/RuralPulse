    ta: கிராமம் அல்லது நகரத்தில் மளிகை, ஸ்டேஷனரி, பழுதுபார்ப்பு போன்ற சிறு கடையை நடத்துகிறார். சரக்கு வாங்கி, வாடிக்கையாளர்களுக்குச் சேவை செய்து, கணக்கைப் பார்த்துக்கொள்கிறார்.
