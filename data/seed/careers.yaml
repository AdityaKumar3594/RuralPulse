- slug: handloom-weaver-craftsperson
  family: creative_crafts
  title: {en: Handloom weaver or craftsperson, ta: கைத்தறி நெசவாளர் அல்லது கைவினைக் கலைஞர்}
  description:
    en: Makes cloth on a handloom or creates handmade items such as baskets, pottery or wood and palm leaf crafts. Keeps traditional skills alive and sells the products locally or through craft groups.
    ta: கைத்தறியில் துணி நெய்கிறார் அல்லது கூடை, மண்பாண்டம், மரம் மற்றும் பனை ஓலைக் கைவினைப் பொருட்கள் போன்றவற்றைக் கையால் செய்கிறார். பாரம்பரியத் திறனைக் காப்பாற்றி, பொருட்களை உள்ளூரிலோ கைவினைக் குழுக்கள் மூலமோ விற்கிறார்.
  activities:
    en: [Prepare threads or raw materials, Weave or shape the product by hand, Add designs and finishing, Sell products and meet buyers]
    ta: [நூல் அல்லது மூலப்பொருட்களைத் தயார் செய்வது, கையால் நெய்வது அல்லது பொருளை வடிவமைப்பது, டிசைன் போட்டு முடிப்பு வேலை செய்வது, பொருட்களை விற்று வாங்குபவர்களைச் சந்திப்பது]
  skills:
    en: [Skilled hands and patience, Sense of design and colour, Knowledge of materials, Basic selling skill]
    ta: [திறமையான கைகளும் பொறுமையும், டிசைன் மற்றும் நிறத்தில் ரசனை, மூலப்பொருட்கள் பற்றிய அறிவு, அடிப்படை விற்பனைத் திறன்]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people learn from family members or master craftspeople over time, and training programmes exist in some places. This is a typical route, not an official requirement.
      ta: பொதுவாக குடும்பத்தினர் அல்லது அனுபவமுள்ள கலைஞர்களிடம் நீண்டகாலம் கற்கிறார்கள்; சில இடங்களில் பயிற்சித் திட்டங்களும் உள்ளன. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: on_the_job, title: {en: Learn from family or a master craftsperson, ta: குடும்பத்தினரிடமோ அனுபவமுள்ள கலைஞரிடமோ கற்றுக்கொள்ளுதல்}, min_stage: null}
    - {kind: short_course, title: {en: Handloom or handicraft training programme, ta: கைத்தறி அல்லது கைவினைப் பயிற்சித் திட்டம்}, min_stage: null}
    - {kind: diploma, title: {en: Textile or craft design diploma or degree, ta: ஜவுளி அல்லது கைவினை வடிவமைப்பு டிப்ளமா அல்லது பட்டப்படிப்பு}, min_stage: class_12}
  related: [tailor-fashion-designer, self-help-group-enterprise, small-shop-owner]
  learning_resources: [skill-india-digital-hub-portal]
  keywords: [handloom, weaver, நெசவு, கைத்தறி, handicraft, கைவினை, pottery, மண்பாண்டம், basket, crafts, silk saree]
