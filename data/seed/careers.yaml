- slug: commercial-driver
  family: transport_logistics
  title: {en: Commercial driver, ta: வணிக வாகன ஓட்டுநர்}
  description:
    en: Drives vehicles such as autos, vans, buses or trucks to carry people or goods. Follows traffic rules, keeps the vehicle in good condition and drives safely.
    ta: ஆட்டோ, வேன், பஸ், லாரி போன்ற வாகனங்களை ஓட்டி ஆட்களையோ சரக்கையோ கொண்டு செல்கிறார். போக்குவரத்து விதிகளைப் பின்பற்றி, வாகனத்தை நல்ல நிலையில் வைத்து, பாதுகாப்பாக ஓட்டுகிறார்.
  activities:
    en: [Drive safely on planned routes, Check the vehicle before each trip, Load and unload with care, Keep trip and vehicle papers in order]
    ta: [திட்டமிட்ட பாதைகளில் பாதுகாப்பாக ஓட்டுவது, ஒவ்வொரு பயணத்துக்கு முன்பும் வாகனத்தைச் சோதிப்பது, கவனமாக ஏற்றி இறக்குவது, பயண மற்றும் வாகன ஆவணங்களை ஒழுங்காக வைத்திருப்பது]
  skills:
    en: [Safe and alert driving, Knowing traffic rules, Basic vehicle checking, Patience on long journeys]
    ta: [பாதுகாப்பாகவும் விழிப்புடனும் ஓட்டுவது, போக்குவரத்து விதிகள் தெரிந்திருப்பது, வாகனத்தை அடிப்படையாகச் சோதிக்கும் திறன், நீண்ட பயணங்களில் பொறுமை]
  entry:
    typical_min_stage: null
    notes:
      en: Typically a valid driving licence of the right type is needed, and the minimum age and education rules vary by vehicle type. This is a typical route, not an official requirement, so check the current transport rules.
      ta: பொதுவாக சரியான வகை ஓட்டுநர் உரிமம் தேவை; குறைந்தபட்ச வயது, படிப்பு விதிகள் வாகன வகையைப் பொறுத்து மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய போக்குவரத்து விதிகளைப் பாருங்கள்.
  routes:
