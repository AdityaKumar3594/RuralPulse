# ---------------- public_service ----------------
- slug: government-clerk
  family: public_service
  title: {en: Government clerk, ta: அரசு எழுத்தர்}
  description:
    en: Handles files, letters, records and data in a government office. Helps citizens and officers by keeping work organised and up to date.
    ta: அரசு அலுவலகத்தில் கோப்புகள், கடிதங்கள், பதிவேடுகள், தரவுகளைக் கையாள்கிறார். வேலைகளை ஒழுங்காகவும் புதுப்பித்தும் வைத்து மக்களுக்கும் அதிகாரிகளுக்கும் உதவுகிறார்.
  activities:
    en: [Maintain files and records, Type letters and enter data, Answer questions from visitors, Pass work to the right officer]
    ta: [கோப்புகளையும் பதிவேடுகளையும் பராமரிப்பது, கடிதம் தட்டச்சு செய்து தரவு பதிவிடுவது, வருபவர்களின் கேள்விகளுக்குப் பதில் சொல்வது, வேலைகளைச் சரியான அதிகாரிக்கு அனுப்புவது]
  skills:
    en: [Neat writing and typing, Basic computer use, Basic maths and language skill, Honesty and patience]
    ta: [நேர்த்தியான எழுத்தும் தட்டச்சும், அடிப்படைக் கணினிப் பயன்பாடு, அடிப்படைக் கணிதம் மற்றும் மொழித் திறன், நேர்மையும் பொறுமையும்]
  entry:
    typical_min_stage: class_10
    notes:
      en: Typically recruitment is through competitive exams, and the needed education depends on the post and the notice. This is a typical route, not an official requirement, so always read the official notification.
      ta: பொதுவாக போட்டித் தேர்வுகள் மூலம் ஆட்கள் எடுக்கப்படுகிறார்கள்; தேவையான படிப்பு பணியையும் அறிவிப்பையும் பொறுத்தது. இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; எப்போதும் அதிகாரபூர்வ அறிவிப்பைப் படியுங்கள்.
  routes:
