- slug: delivery-logistics-worker
  family: transport_logistics
  title: {en: Delivery and logistics worker, ta: டெலிவரி மற்றும் சரக்குப் பணியாளர்}
  description:
    en: Moves parcels and goods from shops, godowns and warehouses to customers. Sorts, packs, loads and delivers items on time and keeps track of them.
    ta: கடைகள், கிடங்குகளிலிருந்து பார்சல்களையும் சரக்குகளையும் வாடிக்கையாளர்களிடம் கொண்டு சேர்க்கிறார். பொருட்களை வரிசைப்படுத்தி, பேக் செய்து, ஏற்றி, சொன்ன நேரத்தில் கொடுத்து, அவற்றின் விவரத்தைக் கண்காணிக்கிறார்.
  activities:
    en: [Sort and pack parcels, Load vehicles and plan delivery routes, Deliver items and confirm receipt, Use a phone app or register to track orders]
    ta: [பார்சல்களை வரிசைப்படுத்திப் பேக் செய்வது, வாகனத்தில் ஏற்றி டெலிவரி பாதையைத் திட்டமிடுவது, பொருட்களைக் கொடுத்து பெற்றுக்கொண்டதை உறுதி செய்வது, ஃபோன் ஆப் அல்லது பதிவேட்டில் ஆர்டர்களைக் கண்காணிப்பது]
  skills:
    en: [Knowing local roads and areas, Being on time and reliable, Basic phone and app use, Careful handling of goods]
    ta: [உள்ளூர்ச் சாலைகள் மற்றும் பகுதிகள் தெரிந்திருப்பது, நேரம் தவறாமையும் நம்பகத்தன்மையும், அடிப்படை ஃபோன் மற்றும் ஆப் பயன்பாடு, பொருட்களைக் கவனமாகக் கையாள்வது]
  entry:
    typical_min_stage: null
    notes:
      en: Typically people start in a delivery or warehouse role without a fixed qualification, and a driving licence may be needed for riding or driving. This is a typical route, not an official requirement, and it varies by employer.
      ta: பொதுவாக குறிப்பிட்ட படிப்பு இல்லாமல் டெலிவரி அல்லது கிடங்குப் பணியில் தொடங்குகிறார்கள்; வண்டி ஓட்ட ஓட்டுநர் உரிமம் தேவைப்படலாம். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; நிறுவனத்தைப் பொறுத்து மாறும்.
