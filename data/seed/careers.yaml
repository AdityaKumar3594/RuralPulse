# ---------------- health_care ----------------
- slug: nurse
  family: health_care
  title: {en: Nurse, ta: நர்ஸ்}
  description:
    en: Cares for patients in hospitals, clinics and health centres. Helps doctors, gives care and medicines as instructed, and supports patients and families.
    ta: மருத்துவமனை, கிளினிக், சுகாதார மையங்களில் நோயாளிகளைக் கவனித்துக்கொள்கிறார். மருத்துவர்களுக்கு உதவி, சொன்னபடி பராமரிப்பும் மருந்தும் கொடுத்து, நோயாளிகளுக்கும் குடும்பத்தினருக்கும் ஆதரவாக இருக்கிறார்.
  activities:
    en: [Check patients and note their condition, Give medicines and dressings as instructed, Help patients with daily care, Explain simple health advice to families]
    ta: [நோயாளிகளைப் பார்த்து அவர்கள் நிலையைக் குறித்து வைப்பது, சொன்னபடி மருந்தும் கட்டும் போடுவது, நோயாளிகளின் அன்றாடப் பராமரிப்பில் உதவுவது, குடும்பத்தினருக்கு எளிய உடல்நல ஆலோசனை சொல்வது]
  skills:
    en: [Caring and kind nature, Attention to detail, Staying calm in difficult moments, Teamwork]
    ta: [அக்கறையும் இரக்கமும், சிறு விஷயங்களையும் கவனிக்கும் திறன், சிரமமான நேரங்களிலும் அமைதியாக இருப்பது, குழுவாக வேலை செய்யும் திறன்]
  entry:
    typical_min_stage: class_12
    notes:
      en: Typically nursing training is taken after Class 12 through a nursing diploma or degree, and some routes may differ. This is a typical route, not an official requirement, so check with the nursing college.
      ta: பொதுவாக 12ஆம் வகுப்புக்குப் பிறகு நர்சிங் டிப்ளமா அல்லது பட்டப்படிப்பு மூலம் பயிற்சி பெறுகிறார்கள்; சில வழிகள் வேறுபடலாம். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; நர்சிங் கல்லூரியில் கேட்டுப் பாருங்கள்.
  routes:
    - {kind: diploma, title: {en: Nursing diploma course, ta: நர்சிங் டிப்ளமா படிப்பு}, min_stage: class_12}
    - {kind: degree, title: {en: Nursing degree course, ta: நர்சிங் பட்டப்படிப்பு}, min_stage: class_12}
  related: [medical-lab-technician, pharmacist, early-childhood-educator]
  learning_resources: [swayam-portal]
  keywords: [nurse, nursing, நர்ஸ், hospital, மருத்துவமனை, patient care, health worker, ANM, GNM]
  source_refs: []

- slug: medical-lab-technician
  family: health_care
  title: {en: Medical lab technician, ta: மருத்துவ ஆய்வக நுட்புநர்}
  description:
    en: Collects and tests samples such as blood and urine in a laboratory. The test results help doctors understand a patient's health.
    ta: ஆய்வகத்தில் ரத்தம், சிறுநீர் போன்ற மாதிரிகளை எடுத்துப் பரிசோதிக்கிறார். பரிசோதனை முடிவுகள் நோயாளியின் உடல்நிலையைப் புரிந்துகொள்ள மருத்துவருக்கு உதவும்.
  activities:
    en: [Collect samples carefully and label them, Run tests with lab equipment, Record results accurately, Keep equipment clean and safe]
    ta: [மாதிரிகளைக் கவனமாக எடுத்து பெயரிடுவது, ஆய்வகக் கருவிகளால் பரிசோதனை செய்வது, முடிவுகளைத் துல்லியமாகப் பதிவு செய்வது, கருவிகளைச் சுத்தமாகவும் பாதுகாப்பாகவும் வைப்பது]
  skills:
    en: [Accuracy and attention to detail, Interest in science and biology, Hygiene and safety habits, Honest record keeping]
    ta: [துல்லியமும் கவனமும், அறிவியல் மற்றும் உயிரியலில் ஆர்வம், சுகாதாரம் மற்றும் பாதுகாப்புப் பழக்கங்கள், நேர்மையாகப் பதிவு வைப்பது]
  entry:
    typical_min_stage: class_12
    notes:
      en: Typically a lab technician course or diploma is taken after Class 12, often with science subjects, though rules vary by course. This is a typical route, not an official requirement.
      ta: பொதுவாக 12ஆம் வகுப்புக்குப் பிறகு, பெரும்பாலும் அறிவியல் பாடங்களுடன், ஆய்வக நுட்புநர் படிப்பு அல்லது டிப்ளமா படிக்கிறார்கள்; படிப்பைப் பொறுத்து விதிகள் மாறும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல.
  routes:
    - {kind: diploma, title: {en: Medical laboratory technology diploma or certificate, ta: மருத்துவ ஆய்வக தொழில்நுட்ப டிப்ளமா அல்லது சான்றிதழ்}, min_stage: class_12}
    - {kind: degree, title: {en: Medical laboratory technology degree, ta: மருத்துவ ஆய்வக தொழில்நுட்பப் பட்டப்படிப்பு}, min_stage: class_12}
    - {kind: short_course, title: {en: Short skill course in lab assistance, ta: ஆய்வக உதவியாளர் குறுகியகாலத் திறன் படிப்பு}, min_stage: class_10}
  related: [nurse, pharmacist, mobile-phone-repair-technician]
  learning_resources: [skill-india-digital-hub-portal, swayam-portal]
  keywords: [lab technician, laboratory, blood test, ஆய்வகம், ரத்தப் பரிசோதனை, DMLT, medical, health, scan, ஆய்வக நுட்புநர்]
  source_refs: []

- slug: pharmacist
  family: health_care
  title: {en: Pharmacist, ta: மருந்தாளுநர்}
  description:
    en: Prepares and gives out medicines in medical shops, hospitals and clinics as prescribed by doctors. Explains how to take medicines safely.
    ta: மருந்துக் கடை, மருத்துவமனை, கிளினிக்கில் மருத்துவர் எழுதிக் கொடுத்தபடி மருந்துகளைத் தயார் செய்து கொடுக்கிறார். மருந்துகளைப் பாதுகாப்பாக எப்படி எடுப்பது என்று விளக்குகிறார்.
  activities:
    en: [Read prescriptions carefully, Give the right medicines and explain how to use them, Check stock and expiry dates, Keep records as required]
    ta: [மருந்துச் சீட்டைக் கவனமாகப் படிப்பது, சரியான மருந்தைக் கொடுத்து எப்படி பயன்படுத்துவது என்று விளக்குவது, இருப்பையும் காலாவதித் தேதியையும் சோதிப்பது, தேவையான பதிவுகளை வைப்பது]
  skills:
    en: [Care and accuracy, Knowledge of medicines, Clear communication, Responsibility]
    ta: [கவனமும் துல்லியமும், மருந்துகள் பற்றிய அறிவு, தெளிவாகப் பேசும் திறன், பொறுப்புணர்வு]
  entry:
    typical_min_stage: class_12
    notes:
      en: Typically a pharmacy diploma or degree is taken after Class 12, and a registration is usually needed to work as a pharmacist. This is a typical route, not an official requirement, so confirm the current rules.
      ta: பொதுவாக 12ஆம் வகுப்புக்குப் பிறகு மருந்தியல் டிப்ளமா அல்லது பட்டம் படிக்கிறார்கள்; மருந்தாளுநராகப் பணிபுரிய பொதுவாக பதிவு தேவைப்படும். இது ஒரு பொதுவான வழி, அதிகாரபூர்வத் தேவை அல்ல; தற்போதைய விதிகளை உறுதி செய்யுங்கள்.
  routes:
    - {kind: diploma, title: {en: Pharmacy diploma course, ta: மருந்தியல் டிப்ளமா படிப்பு}, min_stage: class_12}
    - {kind: degree, title: {en: Pharmacy degree course, ta: மருந்தியல் பட்டப்படிப்பு}, min_stage: class_12}
  related: [nurse, medical-lab-technician, small-shop-owner]
  learning_resources: [swayam-portal]
