- slug: naps-stipend-support
  source: apprenticeship-india
  kind: scheme
  title:
    en: National Apprenticeship Promotion Scheme (NAPS) stipend support
    ta: தேசிய அப்ரென்டிஸ் ஊக்குவிப்புத் திட்டம் (NAPS) உதவித்தொகை ஆதரவு
  summary:
    en: Apprenticeship training under the Apprentices Act, 1961, where the Government of India supports part of the apprentice's stipend.
    ta: 1961 அப்ரென்டிஸ் சட்டத்தின் கீழான பயிற்சியில், அப்ரென்டிஸின் உதவித்தொகையின் ஒரு பகுதியை இந்திய அரசு ஆதரிக்கிறது.
  provider: Ministry of Skill Development and Entrepreneurship
  url: https://www.apprenticeshipindia.gov.in
  keywords: [apprenticeship, naps, stipend, apprentice, training, industry]
  benefits:
    - text:
        en: "The Government share of the stipend under NAPS is limited to 25% of the prescribed minimum stipend, up to a maximum of Rs. 1,500 per month per apprentice, paid by Direct Benefit Transfer to apprentices engaged under the Apprentices Act, 1961."
        ta: "NAPS-இன் கீழ் அரசின் பங்கு, நிர்ணயிக்கப்பட்ட குறைந்தபட்ச உதவித்தொகையின் 25% ஆகும்; ஒரு அப்ரென்டிஸுக்கு மாதம் அதிகபட்சம் ரூ. 1,500 வரை, 1961 அப்ரென்டிஸ் சட்டத்தின் கீழ் ஈடுபடுத்தப்பட்டவர்களுக்கு நேரடிப் பயன் பரிமாற்றம் மூலம் வழங்கப்படும்."
      amount_inr: 1500
      period: month
  verification:
