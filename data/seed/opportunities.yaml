- slug: nmmss-scholarship
  source: national-scholarship-portal
  kind: scholarship
  title:
    en: National Means-cum-Merit Scholarship Scheme (NMMSS)
    ta: தேசிய வருமானம்-தகுதி உதவித்தொகைத் திட்டம் (NMMSS)
  summary:
    en: A scholarship for students in Government, Government-aided or local body schools, applied for on the National Scholarship Portal. Check the official guidelines for current amounts, classes and dates.
    ta: அரசு, அரசு உதவிபெறும் அல்லது உள்ளாட்சிப் பள்ளி மாணவர்களுக்கான உதவித்தொகை; தேசிய உதவித்தொகை இணையதளத்தில் விண்ணப்பிக்க வேண்டும். தற்போதைய தொகை, வகுப்புகள், தேதிகளுக்கு அதிகாரபூர்வ வழிகாட்டுதல்களைப் பாருங்கள்.
  provider: Ministry of Education
  url: https://scholarships.gov.in
  keywords: [scholarship, merit, means, income, school, students, nmmss]
  eligibility:
    max_family_income_inr_per_year: 350000
    other_criteria:
      - {en: "Studies in a Government, Government-aided or local body school.", ta: "அரசு, அரசு உதவிபெறும் அல்லது உள்ளாட்சிப் பள்ளியில் படிப்பவர்."}
      - {en: "Scored at least 55% (or equivalent grade) in the Class VII examination, relaxable by 5% for SC/ST students.", ta: "VII வகுப்புத் தேர்வில் குறைந்தது 55% (அல்லது இணையான தரம்) பெற்றிருக்க வேண்டும்; SC/ST மாணவர்களுக்கு 5% தளர்வு."}
    text:
      en: "Students of any community studying in Government, Government-aided or local body schools. Parental income from all sources must be not more than Rs. 3,50,000 per annum. Students must have scored a minimum of 55% marks or equivalent grade in the Class VII examination to appear in the selection test (relaxable by 5% for SC/ST students)."
      ta: "எந்தச் சமூகத்தைச் சேர்ந்த மாணவரும், அரசு, அரசு உதவிபெறும் அல்லது உள்ளாட்சிப் பள்ளியில் படிப்பவராக இருக்க வேண்டும். பெற்றோரின் அனைத்து வருமானமும் ஆண்டுக்கு ரூ. 3,50,000-க்கு மிகாமல் இருக்க வேண்டும். தேர்வுக்குத் தோன்ற, VII வகுப்புத் தேர்வில் குறைந்தது 55% மதிப்பெண் அல்லது அதற்கு இணையான தரம் தேவை (SC/ST மாணவர்களுக்கு 5% தளர்வு)."
  required_documents:
    - Income certificate of parent or guardian issued by the competent authority in the State or UT
    - Caste certificate
  verification:
    status: verified
    verified_fields: [url, provider, eligibility, documents]
    verified_at: 2026-10-18
    verified_by: claude-code-agent (automated check)
    evidence:
      - {url: "https://scholarships.gov.in/public/schemeGuidelines/NMMSS_FAQ.pdf", note: "Official NMMSS FAQ (Q1 eligibility; Q4 documents given to the school or institute for verification of the online application). The FAQ does not state classes covered or the scholarship amount, so neither is recorded."}

